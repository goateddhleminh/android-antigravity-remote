name: Build & Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Run unit tests & build debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Rename APK artifact
        run: |
          TAG="${GITHUB_REF_NAME:-v1.0.0}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "antigravity-remote-${TAG}-debug.apk"

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: Antigravity Remote ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          generate_release_notes: true
          files: antigravity-remote-*-debug.apk
